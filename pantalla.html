<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modo Pantalla | Pura Smash</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#17100c">
<link rel="preconnect" href="https://hofmqfujmtmflcjutjvu.supabase.co" crossorigin>
<link rel="dns-prefetch" href="//hofmqfujmtmflcjutjvu.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@600;800&family=Work+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17100c;--ink2:#241811;--cream:#f7f1e4;--mustard:#e3a62f;
  --ember:#c2432b;--muted:rgba(247,241,228,.65);--line:rgba(255,255,255,.12)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--cream)}
body{font-family:'Work Sans',sans-serif}
button{font:inherit}
.stage{position:fixed;inset:0;background:
 radial-gradient(circle at 18% 15%,rgba(227,166,47,.10),transparent 28%),
 radial-gradient(circle at 85% 75%,rgba(194,67,43,.14),transparent 33%),
 #17100c}
.slide{position:absolute;inset:0;opacity:0;transform:scale(1.025);transition:opacity .75s ease,transform 1.05s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.slide.active{opacity:1;transform:scale(1);pointer-events:auto}
.product-slide{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(380px,.82fr);height:100%}
.product-slide.reverse{grid-template-columns:minmax(380px,.82fr) minmax(0,1.18fr)}
.visual{position:relative;overflow:hidden;min-width:0;background:#2a1c14}
.visual::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,rgba(23,16,12,.42) 100%)}
.reverse .visual::after{background:linear-gradient(270deg,transparent 60%,rgba(23,16,12,.42) 100%)}
.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02);animation:kenburns 12s ease-in-out infinite alternate}
@keyframes kenburns{to{transform:scale(1.09) translate3d(-.8%,.5%,0)}}
.copy{position:relative;display:flex;flex-direction:column;justify-content:center;padding:clamp(34px,5vw,92px);z-index:2;background:linear-gradient(140deg,#21150f,#17100c)}
.reverse .copy{grid-column:1;grid-row:1}.reverse .visual{grid-column:2;grid-row:1}
.eyebrow{font:800 clamp(11px,1.1vw,18px) 'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--mustard);text-transform:uppercase;margin-bottom:20px}
h1{font-family:'Anton',sans-serif;font-size:clamp(52px,6.5vw,128px);font-weight:400;line-height:.93;letter-spacing:.01em;text-transform:uppercase;margin:0;max-width:9ch;text-wrap:balance}
.desc{margin:24px 0 0;color:var(--muted);font-size:clamp(17px,1.5vw,28px);line-height:1.45;max-width:34ch}
.price{font:800 clamp(50px,5.8vw,108px) 'JetBrains Mono',monospace;color:var(--mustard);margin-top:30px;letter-spacing:-.05em}
.brand{position:absolute;left:32px;top:26px;z-index:10;display:flex;flex-direction:column;line-height:.92;text-shadow:0 3px 18px rgba(0,0,0,.5)}
.brand strong{font-family:'Anton';font-size:clamp(25px,2vw,40px);font-weight:400;letter-spacing:.04em}
.brand span{font:800 9px 'JetBrains Mono';letter-spacing:.15em;color:#ffd36a;margin-top:7px}
.site{position:absolute;right:34px;bottom:26px;z-index:12;font:800 clamp(12px,1vw,18px) 'JetBrains Mono';letter-spacing:.04em;color:rgba(247,241,228,.78)}
.progress{position:absolute;left:0;bottom:0;height:5px;background:var(--mustard);z-index:20;width:0}
.slide.active .progress.running{animation:progress var(--duration) linear forwards}
@keyframes progress{from{width:0}to{width:100%}}
.summary{display:flex;flex-direction:column;height:100%;padding:clamp(34px,4vw,72px);background:
 radial-gradient(circle at 80% 15%,rgba(227,166,47,.12),transparent 23%),
 linear-gradient(145deg,#241811,#17100c 65%)}
.summary-head{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:28px}
.summary h2{font-family:'Anton';font-size:clamp(50px,5vw,92px);font-weight:400;line-height:.95;margin:0;text-transform:uppercase}
.summary-sub{font:800 clamp(12px,1vw,17px) 'JetBrains Mono';letter-spacing:.12em;color:var(--mustard);text-transform:uppercase;margin-bottom:8px}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.6vw,28px);min-height:0}
.card{position:relative;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#241811;min-height:0}
.card img{width:100%;height:100%;object-fit:cover}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(13,8,5,.94) 100%)}
.card-copy{position:absolute;left:0;right:0;bottom:0;padding:clamp(16px,2vw,30px);z-index:2}
.card-name{font-family:'Anton';font-size:clamp(25px,2.4vw,45px);line-height:1;text-transform:uppercase}
.card-price{font:800 clamp(21px,2vw,36px) 'JetBrains Mono';color:#ffd36a;margin-top:9px}
.controls{position:fixed;right:18px;top:18px;z-index:100;display:flex;gap:8px;opacity:0;transform:translateY(-5px);transition:.25s}
body.controls-visible .controls{opacity:1;transform:none}
.ctrl{border:1px solid rgba(255,255,255,.18);background:rgba(15,10,7,.72);backdrop-filter:blur(10px);color:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:800;font-size:12px}
.ctrl:hover{background:rgba(227,166,47,.18)}
.dots{position:fixed;left:50%;bottom:23px;transform:translateX(-50%);z-index:50;display:flex;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.27);transition:.25s}
.dot.active{width:24px;border-radius:999px;background:var(--mustard)}
.loading,.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px}
.loading-box{font:800 15px 'JetBrains Mono';letter-spacing:.1em;color:#ffd36a}
.loading-box b{display:block;font:400 clamp(38px,4vw,70px) 'Anton';color:white;margin-bottom:8px}
.error-note{font-size:12px;opacity:.55;margin-top:12px}
@media(max-aspect-ratio:1/1){
 .product-slide,.product-slide.reverse{grid-template-columns:1fr;grid-template-rows:58% 42%}
 .reverse .visual{grid-column:1;grid-row:1}.reverse .copy{grid-column:1;grid-row:2}
 .copy{padding:28px 30px}.desc{display:none}.price{margin-top:16px}
 .grid{grid-template-columns:1fr;grid-auto-rows:1fr}.card:nth-child(n+3){display:none}
}
@media(prefers-reduced-motion:reduce){.slide,.visual img{transition:none;animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="loading" id="loading"><div class="loading-box"><b>PURA SMASH</b>CARGANDO MENÚ…</div></div>
</div>
<div class="brand"><strong>PURA SMASH</strong><span>SMASH BURGERS · ESPARZA</span></div>
<div class="site">purasmash.com</div>
<div class="controls">
  <button class="ctrl" id="prev" type="button">‹ Anterior</button>
  <button class="ctrl" id="pause" type="button">⏸ Pausar</button>
  <button class="ctrl" id="next" type="button">Siguiente ›</button>
  <button class="ctrl" id="full" type="button">⛶ Pantalla completa</button>
</div>
<div class="dots" id="dots"></div>

<script>
const SUPABASE_URL="https://hofmqfujmtmflcjutjvu.supabase.co";
const SUPABASE_KEY="sb_publishable_rI6Vi8smNkCuKvUkZyElIg_PFvu1kXE";
const DURACION=8000;
let slides=[];
let indice=0;
let timer=null;
let pausado=false;
let hideControlsTimer=null;

const money=n=>"₡"+Math.round(Number(n)||0).toLocaleString("es-CR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

async function supabaseFetch(path,options={}){
  const r=await fetch(SUPABASE_URL+path,{
    ...options,
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json",
      ...(options.headers||{})
    },
    cache:"no-store"
  });
  if(!r.ok) throw new Error(await r.text()||("HTTP "+r.status));
  return r.json();
}

async function cargarProductos(){
  const qs="/rest/v1/productos?select=id,nombre,descripcion,precio,categoria,activo,disponible,imagen_url,etiqueta&activo=eq.true&categoria=in.(burgers,combos)&order=categoria.asc,nombre.asc";
  const [productos,stock]=await Promise.all([
    supabaseFetch(qs),
    supabaseFetch("/rest/v1/rpc/menu_disponibilidad_stock",{method:"POST",body:"{}"}).catch(()=>[])
  ]);
  const disponibilidad=new Map((stock||[]).filter(x=>x.tipo==="producto").map(x=>[String(x.id),x.disponible!==false]));
  return (productos||[])
    .filter(p=>p.disponible!==false)
    .filter(p=>!disponibilidad.has(String(p.id)) || disponibilidad.get(String(p.id)))
    .filter(p=>p.imagen_url);
}

function crearProducto(p,i){
  const art=document.createElement("article");
  art.className="slide";
  const reverse=i%2===1?" reverse":"";
  art.innerHTML=`
    <div class="product-slide${reverse}">
      <div class="visual"><img src="${esc(p.imagen_url)}" alt="${esc(p.nombre)}"></div>
      <div class="copy">
        <div class="eyebrow">${esc(p.etiqueta||"Smash Burger Artesanal")}</div>
        <h1>${esc(p.nombre)}</h1>
        ${p.descripcion?`<p class="desc">${esc(p.descripcion)}</p>`:""}
        <div class="price">${money(p.precio)}</div>
      </div>
    </div>
    <div class="progress" style="--duration:${DURACION}ms"></div>`;
  return art;
}

function crearResumen(productos){
  const art=document.createElement("article");
  art.className="slide";
  const cards=productos.slice(0,3).map(p=>`
    <div class="card">
      <img src="${esc(p.imagen_url)}" alt="${esc(p.nombre)}">
      <div class="card-copy">
        <div class="card-name">${esc(p.nombre)}</div>
        <div class="card-price">${money(p.precio)}</div>
      </div>
    </div>`).join("");
  art.innerHTML=`
    <div class="summary">
      <div class="summary-head">
        <div>
          <div class="summary-sub">Elegí tu favorita</div>
          <h2>Smash Burgers<br>Artesanales</h2>
        </div>
        <div class="price" style="font-size:clamp(24px,2.2vw,42px);margin:0;text-align:right">Pedí en<br>purasmash.com</div>
      </div>
      <div class="grid">${cards}</div>
    </div>
    <div class="progress" style="--duration:${DURACION}ms"></div>`;
  return art;
}

function precargarSiguientes(){
  if(!slides.length)return;
  [1,2].forEach(offset=>{
    const img=slides[(indice+offset)%slides.length]?.querySelector("img");
    if(img?.src){const pre=new Image();pre.src=img.src;}
  });
}

function mostrar(n,reiniciar=true){
  if(!slides.length)return;
  indice=(n+slides.length)%slides.length;
  slides.forEach((s,i)=>{
    const active=i===indice;
    s.classList.toggle("active",active);
    const p=s.querySelector(".progress");
    if(p){
      p.classList.remove("running");
      if(active && !pausado){
        void p.offsetWidth;
        p.classList.add("running");
      }
    }
  });
  document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active",i===indice));
  precargarSiguientes();
  if(reiniciar)programar();
}

function programar(){
  clearTimeout(timer);
  if(!pausado && slides.length>1) timer=setTimeout(()=>mostrar(indice+1),DURACION);
}

function montar(productos){
  const stage=document.getElementById("stage");
  stage.innerHTML="";
  productos.forEach((p,i)=>stage.appendChild(crearProducto(p,i)));
  if(productos.length>1)stage.appendChild(crearResumen(productos));
  slides=[...stage.querySelectorAll(".slide")];
  const dots=document.getElementById("dots");
  dots.innerHTML=slides.map((_,i)=>`<span class="dot${i===0?" active":""}"></span>`).join("");
  mostrar(Math.min(indice,slides.length-1),false);
  programar();
}

async function recargar(silencioso=false){
  try{
    const productos=await cargarProductos();
    if(!productos.length){
      document.getElementById("stage").innerHTML='<div class="empty"><div class="loading-box"><b>PURA SMASH</b>MENÚ TEMPORALMENTE NO DISPONIBLE<div class="error-note">Actualizando automáticamente…</div></div></div>';
      slides=[];clearTimeout(timer);return;
    }
    montar(productos);
  }catch(e){
    console.warn("Pantalla:",e);
    if(!silencioso && !slides.length){
      document.getElementById("stage").innerHTML='<div class="empty"><div class="loading-box"><b>PURA SMASH</b>NO SE PUDO CARGAR EL MENÚ<div class="error-note">Reintentando automáticamente…</div></div></div>';
    }
  }
}

document.getElementById("prev").onclick=()=>mostrar(indice-1);
document.getElementById("next").onclick=()=>mostrar(indice+1);
document.getElementById("pause").onclick=()=>{
  pausado=!pausado;
  document.getElementById("pause").textContent=pausado?"▶ Reanudar":"⏸ Pausar";
  mostrar(indice);
};
document.getElementById("full").onclick=async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch{}
};

function mostrarControles(){
  document.body.classList.add("controls-visible");
  clearTimeout(hideControlsTimer);
  hideControlsTimer=setTimeout(()=>document.body.classList.remove("controls-visible"),3000);
}
["mousemove","mousedown","touchstart","keydown"].forEach(ev=>addEventListener(ev,mostrarControles,{passive:true}));
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")mostrar(indice+1);
  if(e.key==="ArrowLeft")mostrar(indice-1);
  if(e.key===" "){e.preventDefault();document.getElementById("pause").click();}
  if(e.key.toLowerCase()==="f")document.getElementById("full").click();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)clearTimeout(timer);else programar();});

recargar();
setInterval(()=>recargar(true),30000);
mostrarControles();
</script>
</body>
</html>
